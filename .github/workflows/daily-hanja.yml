name: 한자 퀴즈 알림

on:
  schedule:
    # 30분마다(매시 3분, 33분) 실행해서, 그 시각(한국시간)을 고른 사람에게만 알림을 보내요.
    - cron: "3,33 * * * *"
  workflow_dispatch:
    inputs:
      to_all:
        description: "지금 모든 구독자에게 테스트 알림 보내기"
        type: boolean
        default: true

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 알림 보내기
        env:
          APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          REST_KEY: ${{ secrets.ONESIGNAL_REST_KEY }}
          SITE: https://eeejoohee.github.io/hanja/
          TO_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.to_all }}
        run: |
          node <<'JS'
          const { HANJA_LEVELS } = require("./hanja-data.js");
          const MAX_TIMES = 4;   // 화면의 MAX_TIMES와 같아야 해요
          const toAll = process.env.TO_ALL === "true";
          const now = new Date();
          const hour = (now.getUTCHours() + 9) % 24;            // 한국시간
          const slot = String(hour).padStart(2, "0") + (now.getUTCMinutes() < 30 ? "00" : "30");
          let failed = false;

          async function send(level, filters) {
            const items = level.themes.flatMap(t => t.items);
            const [han] = items[Math.floor(Math.random() * items.length)];
            const title = `${level.name} 한자 퀴즈 ✏️`;
            const text = `${han} 은(는) 무슨 뜻일까요? 눌러서 맞혀 보세요!`;
            const body = {
              app_id: process.env.APP_ID,
              target_channel: "push",
              headings: { en: title, ko: title },
              contents: { en: text, ko: text },
              url: `${process.env.SITE}?q=${encodeURIComponent(han)}&lv=${level.id}`,
              priority: 10,   // 높은 우선순위: 폰이 절전 상태여도 바로 전달
              ttl: 1800       // 30분 안에 전달 못 하면 버림 (한밤중에 늦게 도착하는 것 방지)
            };
            if (filters) body.filters = filters; else body.included_segments = ["Total Subscriptions"];
            const r = await fetch("https://api.onesignal.com/notifications", {
              method: "POST",
              headers: { "Content-Type": "application/json", "Authorization": "Key " + process.env.REST_KEY },
              body: JSON.stringify(body)
            });
            const t = await r.text();
            if (/not subscribed/.test(t)) { console.log(`${level.name}: 이 시간을 고른 구독자가 없어요`); return; }
            console.log(level.name, r.status, t);
            if (!r.ok || /"errors"/.test(t)) failed = true;
          }

          (async () => {
            if (toAll) {
              await send(HANJA_LEVELS[0]);
            } else if (slot < "0600" || slot > "2200") {
              console.log(`한국시간 ${slot.slice(0,2)}:${slot.slice(2)}은 알림 시간이 아니에요`);
            } else {
              console.log(`한국시간 ${slot.slice(0,2)}:${slot.slice(2)} 알림 확인`);
              for (const level of HANJA_LEVELS) {
                const filters = [];
                for (let i = 1; i <= MAX_TIMES; i++) {
                  if (i > 1) filters.push({ operator: "OR" });
                  filters.push({ field: "tag", key: "t" + i, relation: "=", value: `${level.id}@${slot}` });
                }
                await send(level, filters);
              }
            }
            if (failed) process.exit(1);
          })();
          JS
