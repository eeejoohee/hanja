<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한자 8급 놀이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Serif+KR:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3FA; --surface:#FFFFFF; --ink:#1F2A44; --muted:#5F6B85;
  --grid:#F2A7AA; --red:#E5484D; --star:#FFB800; --ok:#1F9E62; --okbg:#DDF5E9; --nobg:#FDE3E4;
  --chip:#DCE5F3; --line:#C9D4E6;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141A28; --surface:#1E2638; --ink:#EEF2FA; --muted:#A3AEC6;
    --grid:#7A3B40; --red:#FF6B70; --star:#FFC83D; --ok:#4BD493; --okbg:#173A2B; --nobg:#46222A;
    --chip:#2A3550; --line:#34405C; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141A28; --surface:#1E2638; --ink:#EEF2FA; --muted:#A3AEC6;
  --grid:#7A3B40; --red:#FF6B70; --star:#FFC83D; --ok:#4BD493; --okbg:#173A2B; --nobg:#46222A;
  --chip:#2A3550; --line:#34405C; color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px 28px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{margin:0;font-size:clamp(1.25rem,6vw,1.6rem);font-weight:400;letter-spacing:-.01em;white-space:nowrap}
h1 .seal{display:inline-block;background:var(--red);color:#fff;font-family:"Noto Serif KR",serif;font-weight:900;border-radius:6px;padding:0 6px;margin-right:6px;transform:rotate(-4deg)}
.stars{font-size:1.05rem;color:var(--muted);white-space:nowrap}
.stars b{color:var(--star);font-weight:400}
.hdr-right{display:flex;align-items:center;gap:8px}
.snd{border:0;background:var(--surface);border-radius:10px;font-size:1.1rem;width:40px;height:36px;cursor:pointer}
.nav .mid{display:flex;flex-direction:column;align-items:center;gap:6px}
.nav .say{flex:none;height:auto;background:var(--chip);color:var(--ink);font:inherit;font-size:1rem;padding:7px 14px;border-radius:10px}
.words li{cursor:pointer}

.mode{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:12px;padding:3px;margin:10px 0 8px}
.mode button{border:0;background:transparent;font:inherit;font-size:1rem;color:var(--muted);padding:7px;border-radius:9px;cursor:pointer}
.mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 0 var(--line)}

.themes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:2px 0 8px}
.themes button{min-width:0;border:0;background:var(--surface);color:var(--ink);font:inherit;font-size:1rem;padding:8px 2px;border-radius:10px;cursor:pointer;white-space:nowrap}
.themes button[aria-pressed="true"]{background:var(--red);color:#fff}

button:focus-visible{outline:3px solid var(--star);outline-offset:2px}

/* card */
.stage{perspective:1000px;margin-top:6px}
.card{position:relative;width:100%;aspect-ratio:1/1.08;transform-style:preserve-3d;transition:transform .5s;cursor:pointer;border:0;padding:0;background:none;font:inherit;color:inherit;display:block}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border-radius:22px;border:3px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px}
.back{transform:rotateY(180deg);text-align:center}
.tian{position:relative;width:72%;aspect-ratio:1;border:3px solid var(--red);display:flex;align-items:center;justify-content:center}
.tian::before,.tian::after{content:"";position:absolute;background:transparent}
.tian::before{left:50%;top:0;bottom:0;border-left:2px dashed var(--grid)}
.tian::after{top:50%;left:0;right:0;border-top:2px dashed var(--grid)}
.big{position:relative;z-index:1;font-family:"Noto Serif KR",serif;font-weight:900;font-size:clamp(7rem,40vw,11rem);line-height:1}
.hint{margin-top:14px;color:var(--muted);font-size:.95rem}
.back .smallhan{font-family:"Noto Serif KR",serif;font-weight:900;font-size:4.2rem;line-height:1}
.back .hun{font-size:2.3rem;margin:10px 0 14px}
.back .tip{font-size:1.15rem;line-height:1.5;background:var(--bg);border-radius:14px;padding:12px 14px;max-width:32ch}

.nav{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:10px}
.nav button{flex:0 0 64px;height:56px;border-radius:16px;border:0;background:var(--ink);color:var(--surface);font-size:1.6rem;cursor:pointer}
.nav button:disabled{opacity:.3}
.count{font-size:1.1rem;color:var(--muted)}
.words{margin-top:16px;background:var(--surface);border-radius:16px;padding:12px 14px}
.words h2{margin:0 0 8px;font-weight:400;font-size:1.05rem;color:var(--muted)}
.words ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.words li{background:var(--chip);border-radius:10px;padding:6px 10px;font-size:1.05rem}
.words li span{font-family:"Noto Serif KR",serif;font-weight:900;margin-right:4px}
.words li em{font-style:normal;color:var(--red)}

/* quiz */
.qtop{display:flex;justify-content:space-between;color:var(--muted);font-size:1rem;margin:4px 2px 8px}
.bar{height:8px;background:var(--chip);border-radius:8px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--star);width:0;transition:width .3s}
.qcard{background:var(--surface);border-radius:22px;border:3px solid var(--ink);padding:18px;display:flex;flex-direction:column;align-items:center}
.qcard .tian{width:56%}
.qcard .big{font-size:clamp(5.5rem,30vw,8rem)}
.qask{margin:12px 0 4px;font-size:1.15rem}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.choices button{display:flex;align-items:center;gap:10px;text-align:left;border:3px solid var(--ink);background:var(--surface);color:var(--ink);font:inherit;font-size:1.3rem;padding:13px 10px;border-radius:16px;box-shadow:0 4px 0 var(--ink);cursor:pointer}
.choices button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.choices .num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--surface);display:flex;align-items:center;justify-content:center;font-size:1.05rem}
.choices button:disabled{cursor:default;transform:none}
.choices button:disabled:not(.ok):not(.no){opacity:.45}
.choices button.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);box-shadow:0 4px 0 var(--ok)}
.choices button.ok .num{background:var(--ok);color:#fff}
.choices button.no{border-color:var(--red);background:var(--nobg);color:var(--red);box-shadow:0 4px 0 var(--red)}
.choices button.no .num{background:var(--red);color:#fff}
.feedback{min-height:3.2em;margin-top:12px;text-align:center;font-size:1.1rem;line-height:1.45}
.primary{display:block;width:100%;border:0;border-radius:16px;background:var(--red);color:#fff;font:inherit;font-size:1.25rem;padding:15px;margin-top:8px;cursor:pointer}
.ghost{display:block;width:100%;border:2px solid var(--line);border-radius:16px;background:transparent;color:var(--ink);font:inherit;font-size:1.1rem;padding:13px;margin-top:10px;cursor:pointer}
.result{text-align:center;background:var(--surface);border-radius:22px;border:3px solid var(--ink);padding:26px 18px}
.result .medal{font-size:3.6rem;letter-spacing:4px}
.result p{font-size:1.4rem;margin:10px 0 4px}
.result small{color:var(--muted);font-size:1rem}
.hide{display:none!important}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
.pop{animation:pop .35s}
@media (prefers-reduced-motion: reduce){.card{transition:none}.pop{animation:none}.bar i{transition:none}}

/* one-screen layout */
html,body{height:100%}
.wrap{height:100%;display:flex;flex-direction:column;padding:12px 16px 10px}
#cardView,#quizView,#quizPlay{flex:1;min-height:0;display:flex;flex-direction:column}
.stage{flex:0 1 min(calc(100vw - 32px),448px);min-height:170px;margin-top:2px;container-type:size;display:flex;align-items:center;justify-content:center}
#cardView{justify-content:flex-start}
.card{width:100%;height:100%;aspect-ratio:auto}
@supports (width:1cqmin){.card{width:100cqmin;height:100cqmin}}
.face{padding:12px;border:1.5px solid var(--line)}
.qcard{border:1.5px solid var(--line)}
.tian{border-width:2px}
.tian{width:auto;height:70%;max-width:85%}
.big{font-size:min(38vw,19vh);font-size:min(38vw,19dvh)}
.hint{margin-top:8px;font-size:.9rem}
.back .smallhan{font-size:3rem}
.back .hun{font-size:1.9rem;margin:6px 0 10px}
.back .tip{font-size:1.05rem;padding:10px 12px}
.nav{margin-top:10px}
.nav button{flex-basis:56px;height:48px}
.nav .mid{flex-direction:row;gap:10px}
.words{margin-top:10px;padding:8px 10px;display:flex;align-items:center;gap:8px}
.words h2{margin:0;flex:none;font-size:.95rem}
.words ul{flex-wrap:nowrap;overflow:hidden;gap:6px}
.words li{flex:none;padding:5px 9px;font-size:1rem}
.qtop{margin:2px 2px 6px}
.bar{margin-bottom:8px}
.qcard{flex:1;min-height:150px;max-height:min(calc(100vw - 32px),448px);padding:10px;justify-content:center}
#quizPlay{justify-content:flex-start}
.qcard .tian{width:auto;height:72%;max-width:70%}
.qcard .big{font-size:min(28vw,12vh);font-size:min(28vw,12dvh)}
.qask{margin:8px 0 0;font-size:1.05rem}
.choices{margin-top:12px;gap:10px}
.choices button{padding:10px;font-size:1.2rem}
.feedback{min-height:2.9em;margin-top:8px;font-size:1rem;line-height:1.4}
.primary{padding:12px;margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--ink);color:var(--surface);padding:12px 16px;border-radius:12px;font-size:1rem;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="seal">漢</span>한자 8급 놀이터</h1>
    <div class="hdr-right"><button class="snd" id="snd" aria-label="자동 소리 끄기">🔊</button><div class="stars" aria-label="모은 별">⭐ <b id="totalStars">0</b></div></div>
  </header>

  <div class="mode" role="group" aria-label="공부 방법">
    <button id="mCard" aria-pressed="true">카드로 외우기</button>
    <button id="mQuiz" aria-pressed="false">퀴즈 풀기</button>
  </div>

  <nav class="themes" id="themes" aria-label="테마"></nav>

  <!-- card mode -->
  <section id="cardView">
    <div class="stage">
      <button class="card" id="card" aria-label="카드를 눌러 뒤집기">
        <div class="face front">
          <div class="tian"><span class="big" id="fHan"></span></div>
          <div class="hint">눌러서 뜻과 소리 보기</div>
        </div>
        <div class="face back">
          <div class="smallhan" id="bHan"></div>
          <div class="hun" id="bHun"></div>
          <div class="tip" id="bTip"></div>
        </div>
      </button>
    </div>
    <div class="nav">
      <button id="prev" aria-label="이전 한자">‹</button>
      <span class="count" id="count"></span>
      <button id="next" aria-label="다음 한자">›</button>
    </div>
    <div class="words" id="words">
      <h2>낱말</h2>
      <ul id="wordList"></ul>
    </div>
  </section>

  <!-- quiz mode -->
  <section id="quizView" class="hide">
    <div id="quizPlay">
      <div class="qtop"><span id="qNum"></span><span>맞힌 개수 <span id="qScore">0</span></span></div>
      <div class="bar"><i id="qBar"></i></div>
      <div class="qcard">
        <div class="tian"><span class="big" id="qHan"></span></div>
        <div class="qask">이 한자의 뜻과 소리는?</div>
      </div>
      <div class="choices" id="choices"></div>
      <div class="feedback" id="feedback" aria-live="polite"></div>
      <button class="primary hide" id="qNext">다음 문제</button>
    </div>
    <div id="quizEnd" class="result hide">
      <div class="medal" id="medal"></div>
      <p id="endText"></p>
      <small id="bestText"></small>
      <button class="primary" id="retry">다시 풀기</button>
      <button class="ghost" id="toCards">카드로 복습하기</button>
    </div>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const THEMES = [
  {name:"숫자", emoji:"🔢", items:[
    ["一","한 일","막대기 하나"],["二","두 이","막대기 둘"],["三","석 삼","막대기 셋"],
    ["四","넉 사","네모난 방 안에 다리 두 개"],["五","다섯 오","손가락 다섯 개를 쫙!"],
    ["六","여섯 륙","모자 쓴 사람이 다리를 벌리고 서 있어요"],["七","일곱 칠","숫자 7을 거꾸로 뒤집은 모양"],
    ["八","여덟 팔","두 다리를 ‘팔’자로 벌렸어요"],["九","아홉 구","9처럼 꼬리가 휘어 있어요"],
    ["十","열 십","더하기(+) 모양"],["萬","일만 만","가장 복잡하니까 가장 큰 숫자"]],
    words:[["十萬","십만"],["三十","삼십"]]},
  {name:"일주일", emoji:"📅", items:[
    ["月","달 월","초승달 모양"],["火","불 화","불꽃이 활활 타오르는 모양"],["水","물 수","물줄기가 갈라져 흐르는 모양"],
    ["木","나무 목","뿌리와 가지가 있는 나무"],["金","쇠 금","땅속에 반짝이는 금덩이 (성씨로는 ‘김’)"],
    ["土","흙 토","땅 위에 흙더미가 쌓였어요"],["日","날 일","동그란 해를 네모로 그렸어요"]],
    words:[["月火水木金土日","월화수목금토일"]]},
  {name:"가족", emoji:"👨‍👩‍👧", items:[

    ["兄","형 형","입(口)이 큰 사람, 말 많은 형"],["弟","아우 제","형 뒤를 졸졸 따라다니는 동생"],
    ["女","계집 녀","다소곳이 앉은 여자"],["人","사람 인","두 다리로 걷는 사람"],["寸","마디 촌","삼촌의 ‘촌’!"]],

  {name:"방향", emoji:"🧭", items:[

    ["南","남녘 남","따뜻한 남쪽"],["北","북녘 북","두 사람이 추워서 등을 돌렸어요"],
    ["中","가운데 중","과녁 한가운데 화살이 꽂혔어요"],["外","바깥 외","저녁에 바깥에서 점을 쳐요"]],
    words:[["東西南北","동서남북"],["外國","외국"]]},
  {name:"학교", emoji:"🏫", items:[
    ["學","배울 학","지붕 아래 아이(子)가 공부해요"],["校","학교 교","나무(木)가 있는 학교"],
    ["敎","가르칠 교","선생님이 가르쳐 주세요"],["先","먼저 선","먼저 태어나신 분, 선생님"],
    ["生","날 생","땅에서 새싹이 쏙 나와요"],["室","집 실","지붕 아래 방"],
    ["門","문 문","문 두 짝이 활짝"],["長","긴 장","머리카락이 긴 어른"]],
    words:[["學校","학교"],["先生","선생"],["敎室","교실"],["校長","교장"],["生日","생일"]]},
  {name:"나라", emoji:"🇰🇷", items:[

    ["軍","군사 군","수레(車)를 덮고 지키는 군인"]],

  {name:"자연", emoji:"🌈", items:[

    ["靑","푸를 청","새싹처럼 푸르러요"],["年","해 년","한 해, 두 해, 나이"]],
    words:[["靑山","청산"],["白人","백인"]]}

const WORDS = [
  ["一月","일월"],["十一","십일"],["二月","이월"],["十二","십이"],["三月","삼월"],["三寸","삼촌"],

  ["十月","시월"],["十萬","십만"],["萬人","만인"],["日月","일월"],["火山","화산"],["山水","산수"],

  ["校長","교장"],["校門","교문"],["敎室","교실"],["先生","선생"],["王室","왕실"],["室長","실장"],
  ["大門","대문"],["大小","대소"],["小國","소국"],["大韓民國","대한민국"],["韓國","한국"],["國民","국민"],
  ["國王","국왕"],["國軍","국군"],["靑山","청산"],["靑白","청백"],["靑年","청년"],["生年","생년"]
];
const ALL = THEMES.flatMap(t=>t.items);
const ALL_IDX = THEMES.length; // "전체" tab

let theme = 0, idx = 0, mode = "card";
const $ = id => document.getElementById(id);

const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let stars = store.get("h8stars",0);
let best = store.get("h8best",{});
$("totalStars").textContent = stars;

const canSpeak = "speechSynthesis" in window;
let soundOn = store.get("h8sound", true);
let koVoice = null;
function pickVoice(){try{const v=speechSynthesis.getVoices();koVoice=v.find(x=>/^ko/i.test(x.lang))||null}catch(e){}}
if(canSpeak){pickVoice(); speechSynthesis.onvoiceschanged=pickVoice}
function speak(t,force){
  if(!canSpeak){if(force)toast("이 브라우저는 소리 기능이 없어요. 크롬이나 사파리로 열어 주세요.");return}
  if(!soundOn&&!force)return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ko-KR";if(koVoice)u.voice=koVoice;u.rate=.85;speechSynthesis.speak(u)}catch(e){}
}
function renderSnd(){$("snd").textContent=soundOn?"🔊":"🔇";$("snd").setAttribute("aria-label",soundOn?"자동 소리 끄기":"자동 소리 켜기")}
$("snd").onclick=()=>{soundOn=!soundOn;store.set("h8sound",soundOn);renderSnd();if(soundOn)speak("소리를 켰어요",true)};
function toast(t){let el=$("toast");el.textContent=t;el.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("show"),3200)}
renderSnd();

function itemsOf(t){return t===ALL_IDX?ALL:THEMES[t].items}

function renderThemes(){
  const box=$("themes"); box.innerHTML="";
  THEMES.forEach((t,i)=>box.appendChild(chip(t.name,i)));
  box.appendChild(chip("전체",ALL_IDX));
  function chip(label,i){
    const b=document.createElement("button");
    b.textContent=label; b.setAttribute("aria-pressed",i===theme);
    b.onclick=()=>{theme=i;idx=0;renderThemes();mode==="card"?renderCard():startQuiz()};
    return b;
  }
}

function renderCard(){
  const list=itemsOf(theme), it=list[idx];
  $("card").classList.remove("flip");
  $("fHan").textContent=it[0]; $("bHan").textContent=it[0];
  $("bHun").textContent=it[1]; $("bTip").textContent=it[2];
  $("count").textContent=`${idx+1} / ${list.length}`;
  $("prev").disabled=idx===0; $("next").disabled=idx===list.length-1;
  const wl=$("wordList"); wl.innerHTML="";
  const words = WORDS.filter(([h])=>h.includes(it[0])).slice(0,3);
  $("words").classList.toggle("hide",!words.length);
  words.forEach(([h,r])=>{const li=document.createElement("li");li.innerHTML=`<span>${h.split(it[0]).join(`<em>${it[0]}</em>`)}</span>${r}`;li.onclick=()=>speak(r,true);wl.appendChild(li)});
}
$("card").onclick=()=>{if($("card").classList.toggle("flip")) speak(itemsOf(theme)[idx][1])};
$("prev").onclick=()=>{if(idx>0){idx--;renderCard()}};
$("next").onclick=()=>{if(idx<itemsOf(theme).length-1){idx++;renderCard()}};

/* quiz */
let qList=[], qi=0, score=0;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function startQuiz(){
  qList = shuffle(itemsOf(theme)).slice(0, theme===ALL_IDX?10:itemsOf(theme).length);
  qi=0; score=0;
  $("quizPlay").classList.remove("hide"); $("quizEnd").classList.add("hide");
  showQ();
}
function showQ(){
  const it=qList[qi];
  $("qHan").textContent=it[0];
  $("qNum").textContent=`${qi+1}번 / ${qList.length}문제`;
  $("qScore").textContent=score;
  $("qBar").style.width=`${qi/qList.length*100}%`;
  $("feedback").textContent=""; $("qNext").classList.add("hide");
  const wrong=shuffle(ALL.filter(x=>x[0]!==it[0])).slice(0,3);
  const opts=shuffle([it,...wrong]);
  const box=$("choices"); box.innerHTML="";
  opts.forEach((o,n)=>{
    const b=document.createElement("button"); b.dataset.ans=o[1];
    b.innerHTML=`<span class="num">${n+1}</span><span>${o[1]}</span>`;
    b.setAttribute("aria-label",`${n+1}번 ${o[1]}`);
    b.onclick=()=>answer(b,o,it); box.appendChild(b);
  });
}
function answer(btn,o,it){
  const btns=[...$("choices").children];
  btns.forEach(b=>{b.disabled=true; if(b.dataset.ans===it[1]) b.classList.add("ok")});
  if(o[0]===it[0]){
    score++; $("qScore").textContent=score;
    btn.classList.add("pop");
    $("feedback").textContent=`딩동댕! ${it[0]} = ${it[1]} 🎉`;
    speak(`딩동댕! ${it[1]}`);
  }else{
    btn.classList.add("no");
    $("feedback").textContent=`정답은 ‘${it[1]}’! ${it[2]}`;
    speak(`정답은 ${it[1]}`);
  }
  $("qNext").textContent = qi===qList.length-1 ? "결과 보기" : "다음 문제";
  $("qNext").classList.remove("hide");
}
$("qNext").onclick=()=>{qi++; qi<qList.length?showQ():endQuiz()};
function endQuiz(){
  $("qBar").style.width="100%";
  $("quizPlay").classList.add("hide"); $("quizEnd").classList.remove("hide");
  const r=score/qList.length;
  const got = r===1?3:r>=.7?2:r>=.4?1:0;
  $("medal").textContent = "⭐".repeat(got)+"☆".repeat(3-got);
  $("endText").textContent = `${qList.length}문제 중 ${score}개 맞혔어요!` + (got===3?" 최고예요!":got===2?" 잘했어요!":" 한 번 더 해볼까요?");
  stars+=got; store.set("h8stars",stars); $("totalStars").textContent=stars;
  const key=String(theme); const prevBest=best[key]||0;
  if(score>prevBest){best[key]=score; store.set("h8best",best)}
  $("bestText").textContent=`이 테마 최고 기록: ${Math.max(score,prevBest)}개`;
}
$("retry").onclick=startQuiz;
$("toCards").onclick=()=>setMode("card");

function setMode(m){
  mode=m;
  $("mCard").setAttribute("aria-pressed",m==="card");
  $("mQuiz").setAttribute("aria-pressed",m==="quiz");
  $("cardView").classList.toggle("hide",m!=="card");
  $("quizView").classList.toggle("hide",m!=="quiz");
  if(m==="card"){idx=0;renderCard()}else startQuiz();
}
$("mCard").onclick=()=>setMode("card");
$("mQuiz").onclick=()=>setMode("quiz");

renderThemes(); renderCard();
</script>
</body>
</html>
